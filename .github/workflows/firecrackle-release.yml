name: FireCrackle Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: FireCrackle
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FireCrackle/package-lock.json
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Build and package
        run: ./scripts/release.ps1 -Installer -CleanInstall
      - name: Upload tester downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FireCrackle-windows-x64
          path: |
            FireCrackle/releases/**/*.zip
            FireCrackle/releases/**/*-Setup.exe
            FireCrackle/releases/**/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
