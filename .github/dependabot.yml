version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /FireCrackle
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directories:
      - /FireCrackle/crates/studio_core
      - /FireCrackle/src-tauri
      - /fire-detection/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /fire-detection
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
