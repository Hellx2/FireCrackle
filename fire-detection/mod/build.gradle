plugins {
    id 'fabric-loom' version '1.14.10'
}

version = project.mod_version
group = 'org.firecracking'

base {
    archivesName = 'firelabel'
}

loom {
    runs {
        client {
            // dev client only: outline the labelled fire boxes on screen (never in the shipped jar).
            // For RECORDING footage turn it off: gradlew runClient -PfirelabelDebug=false
            property 'firelabel.debug', (findProperty('firelabelDebug') ?: 'true').toString()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

java {
    withSourcesJar()
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
